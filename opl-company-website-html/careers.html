<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orientfunds Precast Ltd. | 鴻輝預製件有限公司</title>
    <link rel="icon" href="img/favicon.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
    <script>
        var savedLang = localStorage.getItem('site_lang');
        if (savedLang === 'en' || savedLang === 'cn') {
            document.documentElement.classList.add('lang-update-pending');
        }
    </script>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <a href="index.html" class="logo">
                <img src="img/OPL%20logo%20with%20company%20name.png" alt="Orientfunds Precast Ltd. Logo">
            </a>
            
            <div class="header-right">
                <div class="lang-switcher">
                    <div class="language-switch">
                        <button class="lang-btn" onclick="switchToEnglish()">EN</button>
                        <span>|</span>
                        <button class="lang-btn active" onclick="switchToChinese()">繁</button>
                        <span>|</span>
                        <button class="lang-btn" onclick="switchToSimplified()">简</button>
                    </div>
                </div>
                
                <nav class="nav">
                    <ul>

            <li><a href="sustainability.html" data-i18n="nav_sustainability">可持續發展</a></li>

        <div class="hero-content">
        </div>

        <div class="container" style="max-width: 1200px; margin: 0 auto;">
            <a href="index.html" style="color: var(--text-light);" data-i18n="breadcrumb_home">首頁</a> <span style="color: var(--text-light);">/</span> <span style="color: var(--text-dark); font-weight: 500;" data-i18n="nav_careers">事業發展</span>
        </div>
    </div>

                <div style="text-align: center;">

                <div>

                    <h3 style="color: #4CAF50; font-weight: 700; margin-bottom: 10px;" data-i18n="nav_careers">事業發展</h3>

                <div class="footer-col">
                    <h3 style="color: #4CAF50; font-weight: 700; margin-bottom: 10px;" data-i18n="nav_contact">聯絡我們</h3>

                    </ul>
                </div>
            </div>
            
            <div class="footer-bottom" style="text-align: left; padding-top: 40px; border-top: none;">

    <script>
        document.querySelector('.menu-toggle').addEventListener('click', function() {
